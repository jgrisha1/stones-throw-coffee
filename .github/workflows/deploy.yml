name: Deploy to GitHub Pages

# Retired Oct 2026: the live site is served by Cloudflare Pages at
# stonesthrowknoxville.com. This workflow built the same site to
# jgrisha1.github.io/stones-throw-coffee/, where it rendered unstyled with
# broken links (BASE is now '/'). Push trigger removed; manual run kept only
# as a fallback. Also unpublish GitHub Pages in the repo settings.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
