name: Rebuild on opening day

# The site is static, so the "coming soon" copy flips to "now open" only when the site is rebuilt
# on or after openingDate (src/config.ts). Cloudflare Pages rebuilds on every push to master, so
# this pushes one empty commit at 6:00am Eastern on Oct 31, 2026. You can also run it by hand from
# the Actions tab at any time to force a rebuild. If the opening date changes, update the cron below.
on:
  schedule:
    - cron: '0 10 31 10 *' # 10:00 UTC = 6:00am EDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Push an empty commit to trigger the Cloudflare Pages build
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "Not 2026, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Rebuild so the site reflects its opening date (automatic)"
          git push
